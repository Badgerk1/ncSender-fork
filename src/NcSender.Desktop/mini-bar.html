<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 48px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #3a3a5e;
      user-select: none;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 12px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    .restore-btn {
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .restore-btn:hover {
      background: #3a8eef;
    }

    .restore-btn:active {
      background: #2a7edf;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="title">ncSender</span>
    <button class="restore-btn" id="restoreBtn">Restore</button>
  </div>
  <script>
    document.getElementById('restoreBtn').addEventListener('click', () => {
      window.miniBar.restore();
    });
  </script>
</body>
</html>
